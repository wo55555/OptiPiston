on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mc:
          - "26.10"
          - "26.20"
          - "26.30"
          - "26.40"
          - "26.50"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: xmake-io/github-action-setup-xmake@v1

      # 26.10's precompiled libcurl links a zlib version that is not installed.
      - if: matrix.mc == '26.10'
        run: |
          xmake global --policies=package.precompiled:n

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ matrix.mc }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-${{ matrix.mc }}-

      # 26.10 builds with MSVC (selected in xmake.lua); the others use clang-cl.
      - name: Setup LLVM
        if: matrix.mc != '26.10'
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows -v --target_type=client --mc=${{ matrix.mc }} -y

      - run: |
          xmake -v -y

      - run: |
          xmake build optipiston-tests
          xmake run optipiston-tests

      - uses: actions/upload-artifact@v7
        with:
          name: OptiPiston-${{ github.sha }}-mc${{ matrix.mc }}-client-windows-x64
          path: |
            bin/
