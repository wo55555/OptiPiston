on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Tags main's head; every line is released under that one tag.
  tag:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        shell: pwsh
        run: |
          $lua = Get-Content xmake.lua -Raw
          if ($lua -notmatch 'local optipiston_version = "([^"]+)"') { throw "optipiston_version not found in xmake.lua" }
          $version = $Matches[1]
          if ((Get-Content CHANGELOG.md -Raw) -notmatch "(?m)^## \[$([regex]::Escape($version))\]") {
            throw "CHANGELOG.md has no section for $version"
          }
          $tooth = (Get-Content tooth.json -Raw | ConvertFrom-Json).version
          if ($tooth -ne $version) { throw "tooth.json version $tooth does not match $version; run xmake f and commit it" }

          $tag = "v$version"
          if (git ls-remote --tags origin "refs/tags/$tag") { throw "Tag $tag already exists" }
          git tag $tag
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE) { throw "Pushing $tag failed" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

  release:
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
