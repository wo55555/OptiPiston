on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        mc:
          - "26.20"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ matrix.mc }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-${{ matrix.mc }}-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows -v --target_type=client --mc=${{ matrix.mc }} -y

      - run: |
          xmake -v -y

      - run: |
          xmake build optipiston-tests
          xmake run optipiston-tests

      - uses: actions/upload-artifact@v7
        with:
          name: OptiPiston-${{ github.sha }}-mc${{ matrix.mc }}-client-windows-x64
          path: |
            bin/
