on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - id: target
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+-mc(\d+\.\d+)$') {
            throw "Unexpected release tag: $tag"
          }
          "mc=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - uses: xmake-io/github-action-setup-xmake@v1

      # 26.10's precompiled libcurl links a zlib version that is not installed.
      - if: steps.target.outputs.mc == '26.10'
        run: |
          xmake global --policies=package.precompiled:n

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ steps.target.outputs.mc }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-${{ steps.target.outputs.mc }}-

      # 26.10 builds with MSVC (selected in xmake.lua); the others use clang-cl.
      - name: Setup LLVM
        if: steps.target.outputs.mc != '26.10'
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows --target_type=client --mc=${{ steps.target.outputs.mc }} -y

      # Configure regenerates tooth.json; Lip installs from the tag, so it must already match.
      - shell: pwsh
        run: |
          git diff --exit-code -- tooth.json
          if ($LASTEXITCODE) { throw "tooth.json at the tag does not match --mc; run xmake f --mc=... and commit it" }
          $version = (Get-Content tooth.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.event.release.tag_name }}") {
            throw "tooth.json version $version does not match the release tag"
          }

      - run: |
          xmake -w -y

      - run: |
          xmake build optipiston-tests
          xmake run optipiston-tests

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: |
            bin/

  update-release-notes:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3

      - uses: softprops/action-gh-release@v3
        with:
          body: |
            ${{ steps.extract-release-notes.outputs.release_notes }}

  upload-to-release:
    needs:
      - build
      - update-release-notes
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: artifact

      - run: |
          cp CHANGELOG.md LICENSE README.md README_ZH.md artifact/

      - run: |
          zip -r ../${{ github.event.repository.name }}-client-windows-x64.zip *
        working-directory: artifact

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ github.event.repository.name }}-client-windows-x64.zip
